<button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Light theme" title="Switch to light theme" hidden>
  <svg class="theme-day" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6 6 6M18 18l1.4 1.4M19.4 4.6 18 6M6 18l-1.4 1.4"/></svg>
  <svg class="theme-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3a9 9 0 1 0 5 15A8 8 0 0 1 16 3Z" fill="currentColor"/></svg>
  <span class="theme-knob" aria-hidden="true"></span>
  <video class="theme-animation" muted playsinline preload="none" aria-hidden="true" hidden data-to-night="{{ url_for('static', filename='images/theme-to-night.webm') }}" data-to-day="{{ url_for('static', filename='images/theme-to-day.webm') }}"></video>
</button>
